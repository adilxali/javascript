<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
      rel="stylesheet"
    />
    <title>Login</title>
    <style>
      .custom-font {
        font-family: "ubuntu", sans-serif;
      }
    </style>
  </head>
  <body class="bg-gray-100 flex justify-center items-center h-screen">
    
      <div
        class="flex flex-col space-y-4 bg-white p-10 rounded w-[calc(100%-2rem)] h-[calc(100vh-10rem)] max-w-lg border border-gray-200 overflow-y-auto"
      >
        <div>
          <h5 class="text-gray-400 custom-font text-lg">
            Please enter your details
          </h5>
          <h1 class="text-gray-700 text-5xl font-bold custom-font mt-2 mb-4">
            Welcome back
          </h1>
        </div>
        <form id="loginForm" class="flex flex-col gap-4">
          <div class="flex flex-col gap-8">
            <input
              type="text"
              id="email"
              placeholder="Email address"
              class="border py-3 px-4 rounded border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder:text-gray-400 placeholder:font-light placeholder:text-sm"
            />
            <input
              type="password"
              id="password"
              placeholder="Password"
              class="border py-3 px-4 rounded border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder:text-gray-400 placeholder:font-light placeholder:text-sm"
            />
          </div>
          <div
            class="flex justify-between items-center text-sm text-gray-400 mt-2 mb-5"
          >
            <label
              class="flex items-center gap-2 text-gray-700 text-xs font-light"
            >
              <input
                type="checkbox"
                class="w-4 h-4 border border-gray-300 rounded focus:ring-0 focus:ring-none focus:outline-none"
              />
              Remember for 30 days
            </label>
            <a
              href="#"
              class="text-blue-500 underline underline-offset-2 hover:underline"
              >Forgot password?</a
            >
          </div>
          <div class="flex flex-col items-center gap-6">
            <button
              type="submit"
              class="bg-blue-500 w-full text-white p-3 rounded text-lg font-light"
            >
              Sign in
            </button>
            <button
              class="w-full bg-white text-black p-3 rounded text-lg font-light border border-gray-300"
            >
              Sign in with Google
            </button>
            <p>
              <span class="text-gray-400 text-md font-light"
                >Don't have an account?</span
              >
              <a
                href="#"
                class="text-blue-500 underline underline-offset-2 hover:underline ml-2"
                >Sign Up</a
              >
            </p>
          </div>
        </form>
      </div>
    
  </body>
</html>
